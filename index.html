<style>
:root{--c:#0a1330;--l:#17327a;--b:#2f7bff;--g:#3ddc84;--m:#8fa3d1}
*{box-sizing:border-box;margin:0}
body{font:15px system-ui,sans-serif;background:linear-gradient(115deg,#000 38%,#06143f 68%,#000);color:#e8eeff;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#000c;backdrop-filter:blur(8px);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5;flex-wrap:wrap}
#sec{position:fixed;left:0;top:0;width:26px;height:26px;opacity:0;border:0;background:none;z-index:30}
.w{height:34px;mix-blend-mode:screen}
#q{flex:1;min-width:150px;padding:9px 14px;border-radius:99px;border:1px solid var(--l);background:var(--c);color:#fff;font:inherit}
#au{display:flex;gap:14px;align-items:center}
.lk{color:#fff;font-weight:700;text-decoration:underline;cursor:pointer}
.me{display:flex;align-items:center;gap:6px;color:#fff;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.hero{text-align:center;padding:34px 16px 20px}.hero img{width:130px}
h1{font-size:26px;margin:8px 0 4px}.m{color:var(--m)}
.btn{background:linear-gradient(90deg,#1b5cff,#2f7bff);color:#fff;border:0;padding:12px 22px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:3px 0}
.btn.g{background:linear-gradient(90deg,#1fb85a,#3ddc84);color:#02240f}.btn:disabled{opacity:.5}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px;max-width:1100px;margin:auto}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;cursor:pointer}.card:hover{border-color:var(--b)}
#m,#sp{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.box{background:#050b1f;border:1px solid var(--l);border-radius:18px;padding:20px;width:100%;max-width:500px;max-height:92vh;overflow:auto;position:relative}
.box input,.box textarea{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid var(--l);background:var(--c);color:#fff;font:inherit}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.er{color:#ff7b7b;min-height:18px;margin:4px 0}
.bar{height:12px;background:var(--c);border-radius:9px;overflow:hidden;margin:10px 0;display:none}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--g))}
.sh{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.sh img,.sh video{height:150px;border-radius:10px}
.sp{width:46px;height:46px;border:5px solid var(--l);border-top-color:var(--b);border-radius:50%;animation:r 1s linear infinite;margin:auto}@keyframes r{to{transform:rotate(1turn)}}
#t{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--b);padding:10px 18px;border-radius:12px;display:none;z-index:40;text-align:center}
.cm{border-top:1px solid var(--l);padding:8px 0;display:flex;gap:8px;align-items:flex-start}
